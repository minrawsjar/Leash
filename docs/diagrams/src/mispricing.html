<!doctype html>
<meta charset="utf-8">
<style>@font-face{font-family:Excali;src:url(Excalifont.woff2)}@font-face{font-family:Virgil;src:url(Virgil.woff2)}body{margin:0;background:#fff}#root{display:inline-block}</style>
<div id="root"></div>
<script src="rough.js"></script>
<script src="lib.js"></script>
<script>
document.fonts.load('16px Excali').then(() => {
const D = sketch({ w: 1520, h: 860,
  title: 'The real attack is mispricing, not withdrawal',
  sub: 'rose: what a manager would do with no withdrawal right at all · mint: the guard in Leash.sol that stops each step · numbers measured in test/audit' });

D.text(32, 135, 'THE ATTACK', { size: 15, color: '#e0457a' });
const steps = [
  '1 · Pull the liquidity\ntake the treasury\'s range\nout of the pool, so the\npool is nearly empty',
  '2 · Push the price\na tiny swap moves it far,\nbecause nothing is in\nthe way',
  '3 · Re-place around it\nput the treasury\'s\ninventory back around\nthe fake low price',
  '4 · Buy it cheap\nbuy the treasury\'s tokens\nfrom another wallet;\nnothing was withdrawn',
];
const guards = [
  'Never empty\nthe full-range anchor stays\nuntil close; the manager can\'t\nmove it; worth ≥ 19% of the\ndeposit (ThinAnchor); the\nmanaged range never drops\nbelow minLiquidity',
  'Pushing costs capital\n+10 pips per tick off the TWAP;\nevery tick has anchor liquidity;\nthe oracle takes the pre-swap\ntick, once per block, at most\n50 ticks/s: a one-block spike\nmoves a 30-min TWAP ≤ 4 ticks',
  'rebalance is refused\nspot > maxTickDeviation from\nthe TWAP: SpotOffTwap; one\nper block: SameBlock; range\n≥ TWAP ± minHalfWidth; grow\nonly at the TWAP (±2), ≤ 5%\nper window: GrowTooFast',
  'Nothing to buy cheap\nthe inventory sits around the\nTWAP; minFee and the off-TWAP\nsurcharge make every round\ntrip pay. A 600-tick drag\ncosts 18.20 tokens; a re-place\nextracts a fraction of that',
];
steps.forEach((s, i) => {
  const x = 30 + i * 370;
  D.box(x, 150, 330, 140, s, 'rose', { head: true });
  if (i < 3) D.arrow([[x + 330, 220], [x + 370, 220]], {});
  D.arrow([[x + 165, 290], [x + 165, 360]], { label: 'stopped by', lx: x + 165, ly: 325 });
  D.box(x, 360, 330, 220, guards[i], 'mint', { head: true });
});

D.text(32, 640, 'THE GRIEF VARIANT', { size: 15, color: '#e0457a' });
D.box(30, 655, 600, 150, 'An outsider pushes the price out of an honest\nmanager\'s range to get its bond slashed\n(the treasury, who gets the bond, could be the one)', 'rose', { head: true });
D.arrow([[630, 730], [710, 730]], { label: 'priced\nout by', lx: 670, ly: 700 });
D.box(710, 655, 780, 150, 'Compliance is judged on the TWAP, counted in seconds\nthree one-block spikes leave the TWAP ≤ 4 ticks, epoch clean; holding the\nrange edge for 110 minutes does breach, but cost 677 tokens against a\n10-token bond (about 68×), paid to the arbitrageur', 'mint', { head: true });
D.done();
});
</script>
