<!doctype html>
<meta charset="utf-8">
<style>@font-face{font-family:Excali;src:url(Excalifont.woff2)}@font-face{font-family:Virgil;src:url(Virgil.woff2)}body{margin:0;background:#fff}#root{display:inline-block}</style>
<div id="root"></div>
<script src="rough.js"></script>
<script src="lib.js"></script>
<script>
document.fonts.load('16px Excali').then(() => {
const D = sketch({ w: 1580, h: 900,
  title: 'The life of a mandate',
  sub: 'post → auction → active epochs → settle each epoch (pay or slash) → close and claim · anyone may checkpoint and settle; the keeper does it every minute' });

D.box(30, 150, 250, 160, 'Treasury: createMandate\nhook creates the pool,\nfee at the cap, pulls the\ninventory, places the opening\nrange + full-range anchor', 'grey', { head: true });
D.box(340, 150, 250, 160, 'Bond auction\nbid(): at least minBond,\nstrictly above the last;\noutbid bond → owed;\nhighest at auctionEnd wins', 'violet', { head: true });

D.panel(650, 120, 500, 400, 'Active epochs · each epochLength seconds, at most 104', 'mint', { fill: '#f4fffa' });
D.box(670, 165, 460, 105, 'Manager: rebalance · setFee\nguarded: one per block, spot near the TWAP,\ngrow ≤ 5% per window, fee in [minFee, maxFee]', 'violet', { head: true });
D.box(670, 285, 460, 105, 'Every swap: beforeSwap\nrecords the pre-swap tick, then books the seconds\nsince the last check as in or out of compliance', 'mint', { head: true });
D.box(670, 405, 460, 95, 'Keeper: checkpoint() every 60 s\nso quiet stretches are judged, not skipped', 'grey', { head: true });

D.box(1210, 150, 280, 160, 'settle(e), in order\nclean if in-seconds are at\nleast uptimeBps (e.g. 95%);\ncaller earns 10 bps of the\ntreasury\'s fee share', 'mint', { head: true });
D.box(1210, 380, 280, 125, 'Clean\nmanager owed managerFeeBps\nof the epoch\'s fees; the last\nclean epoch frees the bond', 'mint', { head: true });
D.box(1210, 570, 280, 125, 'Breach\nslash = bond × (out − allowance)\n/ allowance; at 2× the allowance\nall of it, manager fired', 'rose', { head: true });

D.box(650, 580, 500, 120, 'Treasury: close()\nsettles what is left, removes the managed range and\nthe anchor, sends idle + fees to the treasury', 'grey', { head: true });
D.box(340, 580, 250, 120, 'claim(currency)\npull payments: pay, returned\nor outbid bonds, slashes', 'violet', { head: true });

D.arrow([[280, 230], [340, 230]], {});
D.arrow([[590, 230], [650, 230]], {});
D.arrow([[1150, 230], [1210, 230]], { label: 'epoch\nends', lx: 1180, ly: 195 });
D.arrow([[1350, 310], [1350, 380]], { label: 'clean', lx: 1350, ly: 345 });
D.arrow([[1490, 270], [1530, 270], [1530, 632], [1490, 632]], { label: 'breach', lx: 1530, ly: 537, labelColor: '#e0457a', color: '#e0457a' });
D.arrow([[1210, 440], [1150, 440]], { label: 'next\nepoch', lx: 1180, ly: 472 });
D.arrow([[1230, 505], [1230, 540], [1180, 540], [1180, 610], [1150, 610]], { label: 'last epoch', lx: 1180, ly: 560 });
D.arrow([[1210, 665], [1150, 665]], {});
D.arrow([[400, 310], [400, 450], [620, 450], [620, 615], [650, 615]], { dashed: true, label: 'no bids: close\nafter auctionEnd', lx: 510, ly: 418 });
D.arrow([[650, 660], [590, 660]], { label: 'then', lx: 620, ly: 685 });

// timeline
const y = 800;
D.arrow([[40, y], [1520, y]], {});
const marks = [[110, 'createMandate'], [430, 'auctionEnd ≥ now + twapWindow'], [760, 'epoch 0'], [900, 'epoch 1'], [1030, '…'], [1180, 'epoch n−1'], [1400, 'end: close']];
marks.forEach(([x, t]) => { D.arrow([[x, y - 14], [x, y + 2]], {}); D.text(x, y + 36, t, { size: 16, anchor: 'middle' }); });
D.text(40, y - 34, 'time', { size: 15, color: '#5b5f73' });
D.done();
});
</script>
