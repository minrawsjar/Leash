<!doctype html>
<meta charset="utf-8">
<style>@font-face{font-family:Excali;src:url(Excalifont.woff2)}@font-face{font-family:Virgil;src:url(Virgil.woff2)}body{margin:0;background:#fff}#root{display:inline-block}</style>
<div id="root"></div>
<script src="rough.js"></script>
<script src="lib.js"></script>
<script>
document.fonts.load('16px Excali').then(() => {
const D = sketch({ w: 1640, h: 1010,
  title: 'Leash: hire a market maker, keep the leash',
  sub: 'mint: the hook and what it protects · violet: the manager and its bond · grey: outside parties and Uniswap\'s own contracts · live on Unichain Sepolia' });

D.text(32, 130, 'WHO', { size: 15, color: '#1fbf86' });
D.text(440, 130, 'THE LEASH HOOK', { size: 15, color: '#1fbf86' });
D.text(1240, 130, 'UNISWAP V4', { size: 15, color: '#1fbf86' });

// who
D.box(30, 160, 230, 110, 'Treasury\nposts the mandate,\nowns the inventory', 'grey', { head: true });
D.box(30, 330, 230, 110, 'Manager\nwins with the highest\nfirst-loss bond', 'violet', { head: true });
D.box(30, 500, 230, 100, 'Keeper\nanyone; every 60 s;\nearns 10 bps on settle', 'grey', { head: true });

// hook
D.panel(430, 150, 700, 560, 'Leash hook 0xA8e4…2880 · flags 0x2880 · no owner, admin, pause or upgrade', 'mint', { fill: '#f4fffa' });
D.box(450, 200, 320, 150, 'Mandates and ledger\nidle0, idle1 and fees per mandate;\nowed[account][currency];\nbonds held in the stablecoin', 'mint', { head: true });
D.box(790, 200, 320, 150, 'Oracle (TWAP) · LeashOracle lib\n1,024 observations, one per block,\npre-swap tick, moves at most\n50 ticks per second', 'mint', { head: true });
D.box(450, 370, 320, 150, 'Bond auction\nbids beat the last bond;\noutbid bonds go to owed;\nhighest bond at auctionEnd wins', 'violet', { head: true });
D.box(790, 370, 320, 150, 'Compliance clock\nin range · deep · on pace,\njudged on the TWAP; seconds\ncount in only if both ends pass', 'mint', { head: true });
D.box(450, 540, 320, 150, 'Rebalance guards\none per block; spot near TWAP;\nrange ≥ TWAP ± minHalfWidth;\ngrow ≤ 5% per window', 'mint', { head: true });
D.box(790, 540, 320, 150, 'Settlement\nclean: managerFeeBps of fees;\nbreach: slash grows with time\nout, all at 2× the allowance', 'mint', { head: true });

// v4
D.box(1240, 160, 150, 550, 'v4\nPoolManager\n\ncalls only\nbeforeInitialize,\nbeforeAdd-\nLiquidity and\nbeforeSwap', 'grey', { size: 15 });
D.box(1430, 230, 190, 260, 'Leash pool\n\nfee: manager\'s\n+ off-TWAP\nsurcharge, ≤ maxFee\n\nmanaged range\n+ full-range anchor', 'mint', { head: true });
D.box(1460, 560, 160, 110, 'Swappers and\narbitrageurs', 'grey');

// arrows: who -> hook
D.arrow([[260, 195], [430, 195]], { label: 'createMandate:\nterms + inventory', lx: 345, ly: 172 });
D.arrow([[430, 245], [260, 245]], { label: 'close: everything', lx: 345, ly: 262 });
D.arrow([[260, 365], [430, 365]], { label: 'bid · rebalance\n· setFee', lx: 345, ly: 342 });
D.arrow([[430, 415], [260, 415]], { label: 'claim: pay + bond', lx: 345, ly: 432 });
D.arrow([[260, 550], [430, 550]], { label: 'checkpoint · settle', lx: 345, ly: 530 });

// hook <-> v4
D.arrow([[1240, 300], [1130, 300]], { label: 'beforeSwap:\nrecord, book', lx: 1185, ly: 270 });
D.arrow([[1130, 470], [1240, 470]], { label: 'unlock:\nmodify-\nLiquidity', lx: 1185, ly: 425 });
D.arrow([[1390, 360], [1430, 360]], {});
D.arrow([[1460, 615], [1390, 615]], { label: 'swap', lx: 1425, ly: 598 });
D.text(1240, 740, 'anyone else\'s initialize or\naddLiquidity: reverts HookOnly', { size: 15, color: '#e0457a' });

// app
D.panel(30, 650, 380, 210, 'The app · leash-khaki.vercel.app/app', 'plain');
D.box(50, 700, 165, 140, 'Web app\nreads events\nand views;\nyour wallet signs', 'grey', { size: 15 });
D.box(230, 700, 160, 140, 'AI drafter\n/api/draft\nfills the form,\nsigns nothing', 'grey', { size: 15 });
D.arrow([[410, 760], [500, 760], [500, 710]], { label: 'reads, writes', lx: 470, ly: 785 });

// banner
D.box(30, 900, 1590, 80, 'THE LEASH: inventory moves only between the hook and the pool, or back to the treasury.\nThe manager\'s two verbs, rebalance and setFee, take no recipient. It receives only its pay and its own bond, through claim.', 'mintStrong', { size: 18 });
D.done();
});
</script>
