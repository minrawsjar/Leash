<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f2eb" />
    <title>Leash — hire a market maker, keep the leash</title>
    <meta name="description" content="Hire a market maker for your treasury without handing over the keys. A Uniswap v4 hook holds the tokens, checks every swap against its own TWAP, pays a clean epoch and slashes a breach." />
    <script>
      // Paper (light) unless the person switched to dark, before the first paint (ThemeToggle.tsx switches it).
      (function () {
        var m = null;
        try { m = localStorage.getItem('leash.theme'); } catch (e) {}
        document.documentElement.dataset.theme = m === 'dark' ? 'dark' : 'light';
        if (m === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#13151b');
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Poppins:wght@400;500;600;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
