<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0d1f" />
    <title>Leash — hire a market maker, keep the leash</title>
    <meta name="description" content="Hire a market maker for your treasury without handing over the keys. A Uniswap v4 hook holds the tokens, checks every swap against its own TWAP, pays a clean epoch and slashes a breach." />
    <script>
      // Palette preview: ?palette=forest|lime|paper|plum (remembered), ?palette=default to reset.
      try {
        const q = new URLSearchParams(location.search).get('palette');
        if (q) localStorage.setItem('leash.palette', q === 'default' ? '' : q);
        const p = localStorage.getItem('leash.palette');
        if (p) document.documentElement.dataset.palette = p;
      } catch {}
    </script>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Poppins:wght@400;500;600;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
